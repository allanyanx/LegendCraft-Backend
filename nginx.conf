server {
    listen 80;
    server_name localhost;

    # 1. OPTIMIZACIÓN EXTREMA PARA IMÁGENES:
    # Si la URL pide algo en /imagenes/, Nginx lo busca en el volumen 
    # sin molestar jamás a tu servidor C# (Kestrel).
    location /imagenes/ {
        alias /usr/share/nginx/html/imagenes/;
        autoindex off;
        
        # Le dice al navegador del cliente que guarde la imagen en caché por 30 días
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 2. PROXY PARA LA API:
    # Todo lo que no sea una imagen, se lo pasa al backend C#
    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Opciones para subida de archivos grandes
        client_max_body_size 10M;
    }
}
